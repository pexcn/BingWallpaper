name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # .NET Framework 4.8 ships with Windows 10 1903+, so the published output is
      # just the executable - no runtime to bundle, nothing to install.
      # -warnaserror keeps the "no compiler warnings" rule enforced instead of
      # merely observed. Drop the flag if a future SDK introduces new warnings.
      - name: Publish
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $describe = & { $ErrorActionPreference = 'Continue'; git describe --tags --long 2>$null }
            if ($describe) { $describe -replace '^v', '' } else { '0.0.0-0-g' + (git rev-parse --short HEAD) }
          }
          Write-Host "Version: $version"
          dotnet publish src/BingWallpaper/BingWallpaper.csproj -c Release -o publish/BingWallpaper -warnaserror -p:Version=$version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BingWallpaper
          path: publish/*
          if-no-files-found: error

      - name: Package release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path publish/BingWallpaper -DestinationPath BingWallpaper.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: BingWallpaper.zip
