name: build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Native AOT cannot cross compile: a Windows executable has to be produced on
    # Windows, and the linker it invokes comes from the Visual Studio C++ build
    # tools that are part of this image.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '1.0.0'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
          }
          Write-Host "Version: $version"
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore src/BingWallpaper/BingWallpaper.csproj

      # -warnaserror keeps the "no compiler warnings" rule enforced instead of
      # merely observed. It also covers the trim and AOT analyzers, which the
      # project turns on for ordinary builds through IsAotCompatible.
      - name: Build
        run: dotnet build src/BingWallpaper/BingWallpaper.csproj -c Release --no-restore -warnaserror -p:Version=${{ steps.version.outputs.value }}

      # This is the step that runs ILCompiler and produces the native executable.
      # It takes a few minutes; that is normal for Native AOT.
      - name: Publish
        run: dotnet publish src/BingWallpaper/BingWallpaper.csproj -c Release -o publish -p:Version=${{ steps.version.outputs.value }}

      - name: Report published files
        shell: pwsh
        run: |
          Get-ChildItem publish -Recurse |
            ForEach-Object { "{0,-30} {1,10:N0} bytes" -f $_.Name, $_.Length }
          $total = (Get-ChildItem publish -Recurse -File | Measure-Object -Property Length -Sum).Sum
          "{0,-30} {1,10:N0} bytes" -f 'TOTAL', $total

      # The Avalonia renderer lives in native libraries that sit next to the
      # executable, so the release is a small zip rather than a bare .exe.
      - name: Package
        id: package
        shell: pwsh
        run: |
          $name = "BingWallpaper-${{ steps.version.outputs.value }}-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $name -CompressionLevel Optimal
          "value=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BingWallpaper
          path: publish/
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.package.outputs.value }}
          generate_release_notes: true
          body: |
            BingWallpaper ${{ steps.version.outputs.value }}

            解压到一个**有写入权限**的目录后运行 `BingWallpaper.exe` 即可，
            配置、日志与壁纸都保存在程序所在目录。

            使用 .NET 10 Native AOT 编译，**无需安装任何运行时**；
            压缩包里除 exe 外的三个 dll 是 Avalonia 的渲染库
            （`libSkiaSharp` / `libHarfBuzzSharp` / `av_libglesv2`），必须与 exe 放在同一目录。
