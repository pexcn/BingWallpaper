name: build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '1.0.0'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
          }
          Write-Host "Version: $version"
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore src/BingWallpaper/BingWallpaper.csproj

      # -warnaserror keeps the "no compiler warnings" rule enforced instead of
      # merely observed. Drop the flag if a future SDK introduces new warnings.
      - name: Build
        run: dotnet build src/BingWallpaper/BingWallpaper.csproj -c Release --no-restore -warnaserror -p:Version=${{ steps.version.outputs.value }}

      # Native AOT: ILC compiles the whole application, Windows Forms included, into
      # one native executable, so the published output needs no .NET runtime on the
      # machine it lands on. Linking is done by the MSVC toolchain that is already
      # part of the windows-latest image, so there is nothing extra to install here.
      - name: Publish
        run: dotnet publish src/BingWallpaper/BingWallpaper.csproj -c Release -o publish -p:Version=${{ steps.version.outputs.value }}

      - name: Report published files
        shell: pwsh
        run: |
          Get-ChildItem publish -Recurse |
            ForEach-Object { "{0,-30} {1,10:N0} bytes" -f $_.Name, $_.Length }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BingWallpaper
          path: publish/BingWallpaper.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: publish/BingWallpaper.exe
          generate_release_notes: true
          body: |
            BingWallpaper ${{ steps.version.outputs.value }}

            单个 exe，**无需安装任何运行时**：.NET 10 + Native AOT，整个程序（含 WinForms）
            已经编译成原生代码，机器上不需要任何 .NET。

            放到一个有写入权限的目录后直接运行即可，配置、日志与壁纸都保存在程序所在目录。
