name: build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '1.0.0'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
          }
          Write-Host "Version: $version"
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore src/BingWallpaper/BingWallpaper.csproj

      # -warnaserror keeps the "no compiler warnings" rule enforced instead of
      # merely observed. Drop the flag if a future SDK introduces new warnings.
      - name: Build
        run: dotnet build src/BingWallpaper/BingWallpaper.csproj -c Release --no-restore -warnaserror -p:Version=${{ steps.version.outputs.value }}

      # Default download: bundles the .NET runtime, runs on a machine with nothing installed.
      - name: Publish (self contained)
        run: dotnet publish src/BingWallpaper/BingWallpaper.csproj -c Release -o publish -p:Version=${{ steps.version.outputs.value }}

      # Small download: needs the .NET Desktop Runtime to be installed.
      # Single file compression is only supported for self contained apps, hence the override.
      - name: Publish (framework dependent)
        run: >
          dotnet publish src/BingWallpaper/BingWallpaper.csproj -c Release -o publish-lite
          -p:Version=${{ steps.version.outputs.value }}
          -p:SelfContained=false
          -p:EnableCompressionInSingleFile=false

      - name: Rename framework dependent executable
        shell: pwsh
        run: Rename-Item publish-lite/BingWallpaper.exe BingWallpaper-lite.exe

      - name: Report sizes
        shell: pwsh
        run: |
          Get-ChildItem publish/BingWallpaper.exe, publish-lite/BingWallpaper-lite.exe |
            ForEach-Object { "{0,-26} {1,10:N0} bytes ({2:N1} MB)" -f $_.Name, $_.Length, ($_.Length / 1MB) }

      - name: Self test (self contained)
        shell: pwsh
        run: |
          $publish = (Resolve-Path publish).Path
          $exe = Join-Path $publish 'BingWallpaper.exe'
          $log = Join-Path $publish 'BingWallpaper.log'
          if (Test-Path $log) { Remove-Item $log -Force }
          Write-Host "Running $exe --selftest"
          # The executable is a GUI subsystem binary, so wait for it explicitly and
          # read the exit code from the process object instead of $LASTEXITCODE.
          $process = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
          if (Test-Path $log) {
            Write-Host '----- BingWallpaper.log -----'
            Get-Content $log
            Write-Host '-----------------------------'
          } else {
            Write-Host 'No log file was produced.'
          }
          if ($process.ExitCode -ne 0) {
            Write-Error "Self test failed with exit code $($process.ExitCode)."
            exit 1
          }
          Write-Host 'Self test passed.'

      - name: Self test (framework dependent)
        shell: pwsh
        run: |
          $exe = Join-Path (Resolve-Path publish-lite).Path 'BingWallpaper-lite.exe'
          Write-Host "Running $exe --selftest"
          $process = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            Write-Error "Self test failed with exit code $($process.ExitCode)."
            exit 1
          }
          Write-Host 'Self test passed.'

      - name: Clean self test leftovers
        shell: pwsh
        run: |
          Get-ChildItem publish, publish-lite -Include 'BingWallpaper.log','BingWallpaper.log.1' -Recurse |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Upload artifact (self contained)
        uses: actions/upload-artifact@v7
        with:
          name: BingWallpaper-win-x64
          path: publish/BingWallpaper.exe
          if-no-files-found: error

      - name: Upload artifact (framework dependent)
        uses: actions/upload-artifact@v7
        with:
          name: BingWallpaper-win-x64-lite
          path: publish-lite/BingWallpaper-lite.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            publish/BingWallpaper.exe
            publish-lite/BingWallpaper-lite.exe
          generate_release_notes: true
          body: |
            BingWallpaper ${{ steps.version.outputs.value }} - portable, single file, win-x64.

            | 下载 | 说明 |
            |---|---|
            | `BingWallpaper.exe` | 自包含，无需安装任何运行时，体积较大 |
            | `BingWallpaper-lite.exe` | 体积极小，需要先安装 [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) |

            两者功能完全相同。放到一个有写入权限的目录后直接运行即可，
            配置、日志与壁纸都保存在程序所在目录。
