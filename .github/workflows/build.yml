name: build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '1.0.0'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
          }
          Write-Host "Version: $version"
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore src/BingWallpaper/BingWallpaper.csproj

      # -warnaserror keeps the "no compiler warnings" rule enforced instead of
      # merely observed. Drop the flag if a future SDK introduces new warnings.
      - name: Build
        run: dotnet build src/BingWallpaper/BingWallpaper.csproj -c Release --no-restore -warnaserror -p:Version=${{ steps.version.outputs.value }}

      # Native AOT: this step invokes the MSVC linker (part of the C++ workload that
      # windows-latest ships with) and takes a few minutes. The .NET runtime ends up
      # inside BingWallpaper.exe, the Windows App SDK runtime next to it, so the
      # target machine needs no installer. The whole folder is the application.
      - name: Publish
        run: dotnet publish src/BingWallpaper/BingWallpaper.csproj -c Release -o publish -p:Version=${{ steps.version.outputs.value }}

      # Temporary: the XAML resources never reach the publish folder. This step
      # collects the evidence needed to pick the fix - what the resource index
      # holds, and what the MSIX tooling switch would produce instead.
      - name: Diagnose XAML resources
        shell: pwsh
        run: |
          $bin = "src/BingWallpaper/bin/Release/net10.0-windows10.0.19041.0/win-x64"

          "### .pri / .xbf in the publish output"
          Get-ChildItem publish -Recurse -File |
            Where-Object { $_.Extension -in '.pri', '.xbf' } |
            ForEach-Object { "{0,-60} {1,9:N0}" -f $_.Name, $_.Length }

          "### what is inside the app's own PRI"
          $makepri = Get-ChildItem "$env:USERPROFILE\.nuget\packages" -Recurse -Filter makepri.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $makepri) {
            "makepri.exe not found"
          } else {
            & $makepri.FullName dump /if "$bin/BingWallpaper.pri" /of pri-dump.xml /o | Out-Null
            Get-Content pri-dump.xml | Select-String -Pattern "ResourceMapSubtree|<NamedResource|ResourceMap name|xbf" |
              ForEach-Object { $_.Line.Trim() } | Select-Object -First 40
          }

          "### what EnableMsixTooling=true would publish"
          dotnet publish src/BingWallpaper/BingWallpaper.csproj -c Release -o publish-msix -p:EnableMsixTooling=true 2>&1 |
            Select-Object -Last 5
          if (Test-Path publish-msix) {
            Get-ChildItem publish-msix -Recurse -File |
              Where-Object { $_.Extension -in '.pri', '.xbf' } |
              ForEach-Object { "{0,-60} {1,9:N0}" -f $_.FullName.Replace("$pwd\publish-msix\", ''), $_.Length }
          }

      # The native PDB the AOT compiler emits is four times the size of the program
      # itself and of no use to anyone running it, so it is kept as its own artifact
      # rather than shipped.
      - name: Separate the debug symbols
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path symbols | Out-Null
          Get-ChildItem publish -Recurse -File -Filter *.pdb | Move-Item -Destination symbols

      - name: Report published size
        shell: pwsh
        run: |
          $files = Get-ChildItem publish -Recurse -File
          $total = ($files | Measure-Object Length -Sum).Sum
          $exe = Get-Item publish/BingWallpaper.exe
          "BingWallpaper.exe (native): {0:N1} MB" -f ($exe.Length / 1MB)
          "{0} files, {1:N1} MB total" -f $files.Count, ($total / 1MB)
          $files | Sort-Object Length -Descending | Select-Object -First 15 |
            ForEach-Object { "{0,-52} {1,10:N0} bytes" -f $_.Name, $_.Length }

      - name: Package
        shell: pwsh
        run: |
          $name = "BingWallpaper-${{ steps.version.outputs.value }}-win-x64"
          Compress-Archive -Path publish/* -DestinationPath "$name.zip" -CompressionLevel Optimal
          "zip=$name.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        id: package

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BingWallpaper-win-x64
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: BingWallpaper-win-x64-symbols
          path: symbols
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.package.outputs.zip }}
          generate_release_notes: true
          body: |
            BingWallpaper ${{ steps.version.outputs.value }}

            WinUI 3（Windows App SDK）+ Native AOT 版本，**无需安装任何运行时**：
            .NET 已编译进 `BingWallpaper.exe`，Windows App SDK 随包附带。

            解压到一个有写入权限的目录后运行 `BingWallpaper.exe` 即可，配置、日志与壁纸都保存在
            程序所在目录。压缩包里的文件请保持在一起，不要只把 exe 单独拷走。
